name: Build and publish to GitHub Pages

# Every push to the main branch rebuilds the Map and publishes it.
# The site lives at https://<owner>.github.io/<repository>/ , so the build is told to
# expect that sub-folder.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same checks the team runs locally; a failing check stops the release.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Switches Pages on for the repository the first time, so nobody has to click it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
